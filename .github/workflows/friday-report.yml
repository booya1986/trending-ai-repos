name: Friday AI report

# Fetches trending AI repos, generates rich bilingual briefs via Claude API,
# builds the HTML report + narration, generates the MP3, and commits everything.
# The Sunday digest workflow then emails it out on its own schedule.
on:
  schedule:
    # 07:05 Israel time. Israel is UTC+3 (IDT) Apr-Oct and UTC+2 (IST) Oct-Mar.
    - cron: "5 4 * * 5"   # 07:05 IDT (summer)
    - cron: "5 5 * * 5"   # 07:05 IST (winter)
    # Safety-net: GitHub frequently misses or delays the primary cron.
    # Run at 09:00, 10:00, 11:00 UTC on Fridays as well; the per-week
    # directory-existence dedup makes every fire after the first a no-op.
    - cron: "0 9-11 * * 5"
  workflow_dispatch:      # allow manual run from the Actions tab
    inputs:
      dry_run:
        description: "Test the pipeline: fetch + briefs + report into a temp dir, uploaded as an artifact. Ignores the per-week dedup and never commits, pushes, or emails."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: friday-report
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install anthropic playwright
          playwright install --with-deps chromium

      - name: Verify required secrets are present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # generate_briefs.py degrades to plain descriptions without a key,
          # which is right for a transient API failure but wrong for a missing
          # secret: the run would go green and ship a report with no briefs.
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=config::ANTHROPIC_API_KEY is not set. Set it with: gh secret set ANTHROPIC_API_KEY --repo booya1986/trending-ai-repos"
            exit 1
          fi
          echo "ANTHROPIC_API_KEY present"

      - name: Fetch trending repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRENDING_NOTES_DIR: ${{ github.workspace }}/reports
        run: |
          python3 scripts/fetch_trending_repos.py > /tmp/trending.json
          count=$(python3 -c "import json; print(json.load(open('/tmp/trending.json'))['count'])")
          week=$(python3 -c "import json; print(json.load(open('/tmp/trending.json'))['week'])")
          echo "Fetched $count repos for $week"
          echo "week=$week" >> "$GITHUB_ENV"
          # Which source each pick came from. "trending" = real weekly star
          # velocity scraped off github.com/trending; "search" = young repo with
          # traction via the Search API. Zero "trending" picks week after week
          # means the scrape broke.
          python3 -c "import json,collections;d=json.load(open('/tmp/trending.json'));print('Sources:',dict(collections.Counter(r.get('source','?') for r in d['repos'])))"
          # Surface fetch warnings as run annotations so a silently degraded
          # fetch (blocked scrape, markup change, lowered star floor) is visible
          # on the run summary instead of hiding inside a green check.
          python3 -c "import json;d=json.load(open('/tmp/trending.json'));[print('::warning title=fetch::'+w) for w in d.get('warnings') or []]"
          if [ "$count" = "0" ]; then
            echo "No repos returned (possible rate limit) -- aborting"
            exit 1
          fi

      - name: Check if report already exists for this week
        id: dedup
        run: |
          # A dry run always proceeds and writes to a throwaway directory, so it
          # can exercise the real briefs/report path without touching a
          # published week or tripping the dedup.
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN -- building into /tmp/dryrun, nothing will be committed"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "outdir=/tmp/dryrun/${{ env.week }}" >> "$GITHUB_ENV"
          elif [ -f "reports/${{ env.week }}/index.html" ]; then
            echo "Report for ${{ env.week }} already exists -- nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "outdir=reports/${{ env.week }}" >> "$GITHUB_ENV"
          fi

      - name: Generate rich briefs (Claude API)
        if: steps.dedup.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/generate_briefs.py /tmp/trending.json /tmp/trending_rich.json

      # News is additive and must never be able to break the repo digest: every
      # command here is `|| true`, and both scripts degrade to a smaller (or
      # empty) news section rather than failing.
      - name: Fetch and summarize AI news (non-fatal)
        if: steps.dedup.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python3 scripts/fetch_ai_news.py > /tmp/news.json || echo '{"items":[],"warnings":["news fetch crashed"]}' > /tmp/news.json
          python3 -c "import json;d=json.load(open('/tmp/news.json'));print('news candidates:',d.get('count',0));[print('::warning title=news::'+w) for w in d.get('warnings') or []]"
          python3 scripts/summarize_news.py /tmp/news.json /tmp/news_rich.json || cp /tmp/news.json /tmp/news_rich.json
          python3 -c "import json;d=json.load(open('/tmp/news_rich.json'));n=len(d.get('stories') or []);print('news stories:',n);print('::warning title=news::only %d news stories of 10'%n) if n<8 else None"

      - name: Build HTML report and narration
        if: steps.dedup.outputs.skip == 'false'
        run: |
          mkdir -p "${{ env.outdir }}"
          python3 scripts/build_report.py --in /tmp/trending_rich.json --news /tmp/news_rich.json --outdir "${{ env.outdir }}"
          # news.json ships next to the report: the Sunday email and the vault
          # note both read it from the committed report directory.
          cp /tmp/news_rich.json "${{ env.outdir }}/news.json" || true
          # Brief sections are the bilingual body of each card. Zero means the
          # briefs step produced nothing and the report would ship empty cards
          # (and the vault note would fall back to its thin format).
          # 12 = 4 brief sections x 3 repos. Update together with REPO_COUNT.
          sections=$(grep -o 'brief-section' "${{ env.outdir }}/index.html" | wc -l | tr -d ' ')
          echo "brief-sections in report: $sections"
          if [ "$sections" -lt 12 ]; then
            # Hard failure, not a warning. generate_briefs.py degrades to plain
            # descriptions on any exception, so a real bug produced a GREEN run
            # shipping a report with no briefs. The sibling L&D pipeline hit
            # exactly that. Fail and let the Friday safety-net crons retry.
            echo "::error title=briefs::only $sections brief-section markers -- the briefs step degraded. Refusing to publish a report without briefs."
            exit 1
          fi
          # Same reasoning as the briefs gate, applied to the news section. When
          # the summarizer falls back it emits English headlines with no Hebrew
          # insight, which renders as ten blank paragraphs: a green run shipping
          # an empty product. Seen for real on 2026-08-22, from a max_tokens
          # truncation.
          python3 - <<'PYCHECK'
          import json, sys
          stories = json.load(open("/tmp/news_rich.json")).get("stories") or []
          blank = sum(1 for s in stories if not (s.get("insight_he") or "").strip())
          print(f"news stories: {len(stories)}, blank Hebrew insights: {blank}")
          if stories and blank > len(stories) // 2:
              print(f"::error title=news::{blank} of {len(stories)} stories have no Hebrew "
                    "insight -- the summarizer fell back. Refusing to publish.")
              sys.exit(1)
          if blank:
              print(f"::warning title=news::{blank} story/stories missing a Hebrew insight")
          PYCHECK

      # The vault note is RENDERED HERE, in the cloud, and committed inside the
      # report directory. The Obsidian vault is a local folder with no git
      # remote, so nothing in CI can write into it; but rendering here means the
      # note EXISTS whether or not the Mac is on, and the Mac's only job becomes
      # copying files it does not have yet (sync_vault_note.py --install-all).
      # Before this, the note was built on the Mac from the published HTML and
      # only ever for the newest week, so a Mac that was off across a Friday
      # lost that week's note permanently.
      - name: Render vault note
        if: steps.dedup.outputs.skip == 'false' && inputs.dry_run != true
        run: |
          python3 scripts/sync_vault_note.py "${{ env.week }}" \
            --emit "${{ env.outdir }}/vault-note.md"

      - name: Build social card (non-fatal)
        if: steps.dedup.outputs.skip == 'false'
        run: |
          python3 scripts/build_og_image.py "${{ env.outdir }}" /tmp/trending_rich.json || true
          if [ ! -f "${{ env.outdir }}/og.png" ]; then
            echo "::warning title=og::no og.png produced -- shared links will preview without an image"
          fi

      # Runs on dry runs too: it writes into the throwaway outdir, so the MP3
      # path is exercised for real (and lands in the artifact) without touching
      # a published week. This step is why the dry run is a full rehearsal.
      - name: Generate MP3 narration (non-fatal)
        if: steps.dedup.outputs.skip == 'false'
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          python3 scripts/generate_tts.py "${{ env.outdir }}" || true
          if [ -f "${{ env.outdir }}/report.mp3" ]; then
            echo "MP3 ok: $(stat -c%s "${{ env.outdir }}/report.mp3") bytes"
          else
            echo "::warning title=tts::no report.mp3 produced -- see warnings.txt"
          fi

      - name: Rebuild archive index
        if: steps.dedup.outputs.skip == 'false' && inputs.dry_run != true
        run: python3 scripts/build_index.py

      - name: Upload dry-run report
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ env.week }}
          path: ${{ env.outdir }}

      - name: Commit and push
        if: steps.dedup.outputs.skip == 'false' && inputs.dry_run != true
        run: |
          git config user.email "avi.j.levi@gmail.com"
          git config user.name "Avi Levi (Friday robot)"
          git add "reports/${{ env.week }}/" 2>/dev/null || true
          git add reports/index.html 2>/dev/null || true
          # The README carries the generated report index.
          git add README.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Add trending AI repos report for ${{ env.week }}"
            # Retry on a rejected push. The Friday run takes several minutes,
            # and anything landing on main meanwhile rejects this push and
            # discards the whole week's work. Rebase and try again rather than
            # losing the report. Observed 2026-08-22.
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push rejected (attempt $attempt); rebasing on the remote"
              git pull --rebase --autostash
              if [ "$attempt" = "3" ]; then
                echo "::error title=push::could not push after 3 attempts"
                exit 1
              fi
            done
          else
            echo "nothing to commit"
          fi
