name: Sunday digest email

# Sends the weekly digest email from GitHub's cloud — runs even when Avi's Mac is off.
# Generates the MP3 first (if missing/stale) so the email's audio link is live.
on:
  schedule:
    # 07:07 Israel time. Israel is UTC+3 (IDT) Apr-Oct and UTC+2 (IST) Oct-Mar.
    # Two entries cover both; the per-week .email_sent dedup makes the extra fire a no-op.
    - cron: "7 4 * * 0"   # 07:07 IDT (summer)
    - cron: "7 5 * * 0"   # 07:07 IST (winter)
    # Heartbeat catch-net: GitHub silently drops/delays the primary fire often.
    # Run hourly Sun 05:00-11:00 UTC (08:00-14:00 IL); .email_sent dedup makes
    # every fire after the first a no-op, so this only sends once/week regardless.
    - cron: "0 5-11 * * 0"
  workflow_dispatch: {}   # allow manual run from the Actions tab
  # External-trigger path: a cloud routine (or anyone) with only contents:write
  # can fire the real SMTP send by pushing to .send-trigger. This does NOT need
  # actions:write (which workflow_dispatch via API would). The .email_sent dedup
  # keeps it a single send per week even if combined with the cron fires.
  push:
    paths:
      - ".send-trigger"

permissions:
  contents: write          # to commit the .email_sent dedup marker + MP3

concurrency:
  group: sunday-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine latest week
        id: week
        run: |
          week=$(ls reports | grep -E '^[0-9]{4}-W[0-9]+$' | sort | tail -1)
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "Latest report week: $week"

      - name: Generate MP3 if missing or stale
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          # Same script and same backend as Friday. This step previously
          # inlined a call to the retired ElevenLabs tts-proxy (with its token
          # hardcoded in the workflow), so Friday produced Google TTS audio and
          # Sunday's fallback tried a different, older service. generate_tts.py
          # already skips when the MP3 matches the current narration hash.
          python3 scripts/generate_tts.py "reports/$WEEK" || \
            echo "::warning title=tts::MP3 not regenerated; the email still sends"

      - name: Send digest email (SMTP via App Password)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 scripts/send_digest_smtp.py "${{ steps.week.outputs.week }}"

      - name: Commit dedup marker + MP3 if changed
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          git config user.email "avi.j.levi@gmail.com"
          git config user.name "Avi Levi (GitHub Actions)"

          # Stage each path in its own `git add`, and only when it exists.
          # A single `git add -f a b c` where one path is missing dies with
          # "pathspec did not match any files" and stages NOTHING -- so when the
          # MP3 was absent (TTS quota failure), .email_sent never got committed,
          # and every hourly catch-net fire re-sent the digest. That shipped 6
          # copies of the W31 email on 2026-08-02.
          for f in .email_sent report.mp3 .narration.sha; do
            p="reports/$WEEK/$f"
            [ -e "$p" ] && git add -f "$p"
          done

          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Sunday digest: mark $WEEK sent (+ MP3 if regenerated)"
            # Retry on a rejected push. The Friday run takes several minutes,
            # and anything landing on main meanwhile rejects this push and
            # discards the whole week's work. Rebase and try again rather than
            # losing the report. Observed 2026-08-22.
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push rejected (attempt $attempt); rebasing on the remote"
              git pull --rebase --autostash
              if [ "$attempt" = "3" ]; then
                echo "::error title=push::could not push after 3 attempts"
                exit 1
              fi
            done
          fi

          # The dedup marker is the only thing preventing a duplicate send, so
          # failing to persist it is worth shouting about even though the email
          # itself already went out.
          if [ -f "reports/$WEEK/.email_sent" ] && ! git ls-tree -r --name-only HEAD | grep -qx "reports/$WEEK/.email_sent"; then
            echo "::error title=dedup::.email_sent for $WEEK was NOT committed -- the next scheduled fire will re-send this digest"
            exit 1
          fi
